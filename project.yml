name: SAVEFORGE
options:
  bundleIdPrefix: com.github.infifunk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SAVEFORGE
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.github.infifunk.SAVEFORGE
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 1
    OTHER_LDFLAGS: "$(inherited) -lz"
targets:
  SAVEFORGE:
    type: application
    platform: iOS
    sources:
      - path: extracted/B05E2494-0B4F-4E4E-AE1F-314341A54E79
        excludes:
          - Config/**
          - Resources/**
    resources:
      - path: extracted/B05E2494-0B4F-4E4E-AE1F-314341A54E79/Resources/Minecraft
        type: folder
      - path: extracted/B05E2494-0B4F-4E4E-AE1F-314341A54E79/Resources/*.json
      - path: extracted/B05E2494-0B4F-4E4E-AE1F-314341A54E79/Resources/*.svg
      - path: Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
