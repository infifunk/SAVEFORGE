name: Xcode iOS Build

on:
  push:
    branches:
      - xcode-native
  pull_request:
    branches:
      - main
      - Test
      - xcode-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app icon asset catalog
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cp Resources/AppIcon.png Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project SAVEFORGE.xcodeproj \
            -scheme SAVEFORGE \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project SAVEFORGE.xcodeproj \
            -scheme SAVEFORGE \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SAVEFORGE.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/SAVEFORGE.xcarchive/Products/Applications/SAVEFORGE.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/SAVEFORGE.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/SAVEFORGE-unsigned.ipa" Payload
          test -s "$RUNNER_TEMP/SAVEFORGE-unsigned.ipa"
          echo "Unsigned IPA created:"
          ls -lh "$RUNNER_TEMP/SAVEFORGE-unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SAVEFORGE-Unsigned-IPA
          path: ${{ runner.temp }}/SAVEFORGE-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: SAVEFORGE-Xcode-Project
          path: |
            SAVEFORGE.xcodeproj
            project.yml
            Assets.xcassets
          if-no-files-found: error
          retention-days: 14
